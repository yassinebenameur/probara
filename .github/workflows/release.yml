name: Release

on:
  push:
    branches: [ dev, staging, main ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write

    steps:
      - name: Ensure semantic release token is configured
        run: |
          if [ -z "${{ secrets.SEMANTIC_RELEASE_TOKEN }}" ]; then
            echo "SEMANTIC_RELEASE_TOKEN is required."
            echo "Configure a PAT so tag pushes can trigger downstream workflows."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Install release dependencies
        run: npm install --no-fund --no-audit

      - name: Authenticate Helm to GHCR
        run: |
          echo "${{ secrets.SEMANTIC_RELEASE_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_HELM_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npm run release
