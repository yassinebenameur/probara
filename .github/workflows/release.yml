name: Release

on:
  push:
    branches: [ dev, staging, main ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write

    steps:
      - name: Resolve release token
        id: release-token
        run: |
          if [ -n "${{ secrets.SEMANTIC_RELEASE_TOKEN }}" ]; then
            echo "token=${{ secrets.SEMANTIC_RELEASE_TOKEN }}" >> "$GITHUB_OUTPUT"
          else
            echo "token=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Install release dependencies
        run: npm install --no-fund --no-audit

      - name: Authenticate Helm to GHCR
        run: |
          echo "${{ steps.release-token.outputs.token }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_HELM_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npm run release
