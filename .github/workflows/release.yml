name: Release

on:
  push:
    branches: [ dev, staging, main ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write

    steps:
      - name: Ensure semantic release token is configured
        run: |
          if [ -z "${{ secrets.SEMANTIC_RELEASE_TOKEN }}" ]; then
            echo "SEMANTIC_RELEASE_TOKEN is required."
            echo "Configure a PAT so tag pushes can trigger downstream workflows."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      # semantic-release tags v* and publishes the chart, which deploys the
      # bundled local AI by default from <prefix>-local-ai:<tag>. docker-build
      # pushes that image only from a release-approved checkpoint, so an
      # unapproved one must stop the release here: otherwise the tag and chart
      # go out and every default install pulls an image that was never pushed.
      # Stdlib only, no Git LFS (reads manifest.json + cpu-evaluation.json).
      - name: Check local AI release gate
        id: local-ai
        run: python3 .github/workflows/scripts/local_ai_artifact.py gate

      - name: Refuse to release an unapproved local AI checkpoint
        if: steps.local-ai.outputs.approved != 'true'
        env:
          VERSION: ${{ steps.local-ai.outputs.version }}
          REASON: ${{ steps.local-ai.outputs.reason }}
        run: |
          echo "::error title=Release blocked: local AI checkpoint not release-approved::$VERSION: $REASON No tag or chart is published until manifest.json and cpu-evaluation.json say release_approved true on cpu."
          {
            echo "### Release blocked: local AI checkpoint not release-approved"
            echo "The chart deploys the bundled local AI by default, and its image is built only from an approved checkpoint, so no tag or chart was published."
            echo "- \`$VERSION\`: $REASON"
          } >>"$GITHUB_STEP_SUMMARY"
          exit 1

      # The tag's local-ai image build fetches laya (pinned commit) and the
      # base model (pinned Hugging Face revision) from third parties. If
      # either is gone, that build fails after the chart is published, and
      # default installs pull an image that does not exist. Seconds, no LFS.
      - name: Check local AI build sources
        env:
          LAYA_GIT_URL: ${{ vars.LAYA_GIT_URL }}
          HF_ENDPOINT: ${{ vars.HF_ENDPOINT }}
        run: python3 .github/workflows/scripts/local_ai_artifact.py sources

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Install release dependencies
        run: npm ci --no-fund --no-audit

      - name: Authenticate Helm to GHCR
        run: |
          echo "${{ secrets.SEMANTIC_RELEASE_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_HELM_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npm run release
