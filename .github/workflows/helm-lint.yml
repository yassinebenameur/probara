name: Helm Lint

on:
  push:
    branches: [ dev, staging, main ]
  pull_request:
    branches: [ dev, staging, main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: 'latest'

    - name: Run helm lint
      run: |
        helm lint ./helm/monitoring-platform

    - name: Run helm template
      run: |
        helm template monitoring-platform ./helm/monitoring-platform --debug --dry-run

    - name: Validate values
      run: |
        helm template monitoring-platform ./helm/monitoring-platform > /dev/null
