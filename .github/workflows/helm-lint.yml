name: Helm Lint

on:
  push:
    branches: [ dev, staging, main ]
  pull_request:
    branches: [ dev, staging, main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: 'latest'

    - name: Run helm lint
      run: |
        helm lint ./helm/monitoring-platform

    - name: Run helm template
      run: |
        helm template monitoring-platform ./helm/monitoring-platform --debug --dry-run

    # Representative installs besides the defaults: an ingress with TLS, the
    # chart-wide existing Secret, and per-field existing Secrets. In each the
    # migrations Job must stay a post-install,pre-upgrade hook, so an upgrade
    # never starts new pods against the old schema.
    - name: Render representative value sets
      run: |
        set -euo pipefail
        chart=./helm/monitoring-platform
        out="$RUNNER_TEMP/helm"
        mkdir -p "$out"
        helm template rel "$chart" > "$out/default.yaml"
        ingress=(--set ingress.enabled=true --set 'ingress.tls[0].secretName=probara-tls'
          --set 'ingress.tls[0].hosts[0]=probara.example.com' --set statusPage.baseUrl=https://status.example.com)
        helm lint "$chart" "${ingress[@]}"
        helm template rel "$chart" "${ingress[@]}" > "$out/ingress-tls.yaml"
        domains=(--set 'statusPage.customDomains[0].host=status.acme.example' --set 'statusPage.customDomains[0].tlsSecretName=acme-tls'
          --set 'statusPage.customDomains[1].host=status.other.example' --set 'statusPage.customDomains[1].tlsSecretName=other-tls')
        helm lint "$chart" "${ingress[@]}" "${domains[@]}"
        helm template rel "$chart" "${ingress[@]}" "${domains[@]}" > "$out/custom-domains.yaml"
        # One Ingress per ingress.hosts entry (the defaults list two) and per
        # custom domain, each its own YAML document: without a separator
        # between them the hosts merge into one document and only the last
        # survives.
        for want in ingress-tls.yaml=2 custom-domains.yaml=4; do
          got="$(yq ea '[select(.kind == "Ingress")] | length' "$out/${want%=*}")"
          [ "$got" = "${want#*=}" ] \
            || { echo "::error::${want%=*}: $got Ingress documents, want ${want#*=}"; exit 1; }
        done
        helm lint "$chart" --set secrets.existingSecret=probara-platform
        helm template rel "$chart" --set secrets.existingSecret=probara-platform > "$out/existing-secret.yaml"
        helm template rel "$chart" --set postgresql.existingSecret=probara-postgres-url \
          --set secrets.statusPagePreviewSecretExistingSecret=probara-preview > "$out/per-field-secrets.yaml"
        for rendered in "$out"/*.yaml; do
          grep -qF '"helm.sh/hook": post-install,pre-upgrade' "$rendered" \
            || { echo "::error::$(basename "$rendered"): the migrations Job is not a post-install,pre-upgrade hook"; exit 1; }
        done
