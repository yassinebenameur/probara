name: Build and Test

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  go-format:
    name: Go formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # LFS bandwidth is metered; only the local-ai job needs the model files.
          lfs: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: make fmt

  go-test:
    name: Go test (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main module
            directory: .
            go-version-file: go.mod
            dependency-path: go.sum
            coverage-file: coverage-main.out
            coverage-flag: main

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # LFS bandwidth is metered; only the local-ai job needs the model files.
          lfs: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.go-version-file }}
          cache-dependency-path: ${{ matrix.dependency-path }}

      - name: Download dependencies
        working-directory: ${{ matrix.directory }}
        run: go mod download

      - name: Run go vet
        working-directory: ${{ matrix.directory }}
        run: go vet ./...

      - name: Run tests
        working-directory: ${{ matrix.directory }}
        # Explicit bash adds -o pipefail, so tee cannot mask a test failure.
        shell: bash
        run: go test -v -race -coverprofile="${{ github.workspace }}/${{ matrix.coverage-file }}" ./... 2>&1 | tee "${{ runner.temp }}/go-test.log"

      # The -v output of the whole module runs to hundreds of thousands of
      # lines, so a failing test scrolls far out of any log tail and the run
      # ends on a bare "FAIL". Repeat the failures at the end of the job, in
      # the step summary, and as annotations on the check run.
      - name: Summarize test failures
        if: failure()
        run: |
          log="${{ runner.temp }}/go-test.log"
          [ -f "$log" ] || exit 0
          # A test's own output precedes its FAIL line; a panic or race
          # report follows its header.
          failed='^[[:space:]]*--- FAIL|^FAIL[[:space:]]'
          crashed='^panic:|^WARNING: DATA RACE'
          context=$({ grep -E -B40 "$failed" "$log"; grep -E -A40 "$crashed" "$log"; } | tail -n 600 || true)
          echo "$context"
          {
            echo '## Go test failures'
            echo '```'
            echo "$context"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^[[:space:]]*--- FAIL|^FAIL[[:space:]]' "$log" | sed -E 's/^[[:space:]]+//' | head -n 50 |
            while IFS= read -r line; do echo "::error title=Go test failure::$line"; done

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: ./${{ matrix.coverage-file }}
          flags: ${{ matrix.coverage-flag }}
          fail_ci_if_error: false

  frontend:
    name: Frontend (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: operator UI
            directory: web
            lockfile: web/package-lock.json
          - name: website
            directory: website
            lockfile: website/package-lock.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # LFS bandwidth is metered; only the local-ai job needs the model files.
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Run lint
        working-directory: ${{ matrix.directory }}
        run: npm run lint

      - name: Run typecheck
        working-directory: ${{ matrix.directory }}
        run: npm exec -- tsc --noEmit

      - name: Run unit tests
        if: matrix.directory == 'web'
        working-directory: ${{ matrix.directory }}
        run: npm test

      - name: Run production build
        working-directory: ${{ matrix.directory }}
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  local-ai:
    name: Bundled CPU AI
    runs-on: ubuntu-latest
    # An approved checkpoint adds the held-out reproduction (2000 int8 CPU
    # decisions) on top of the base fetch and composition.
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ai-service:ai-service/training
    steps:
      # The only job here that needs Git LFS: the committed decision heads
      # (ai-service/artifacts/*/head.safetensors, the sole LFS pattern).
      # LFS bandwidth is metered and this job runs on every push, so the
      # objects are cached by their oids and pulled only when a head changes.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: List Git LFS objects
        id: lfs
        run: echo "key=$(git lfs ls-files --long | sort | sha256sum | cut -c1-32)" >>"$GITHUB_OUTPUT"

      - name: Restore Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: local-ai-lfs-${{ steps.lfs.outputs.key }}

      # Checksums are re-checked against manifest.json by the compose step.
      - name: Pull Git LFS head weights
        run: git lfs pull --include 'ai-service/artifacts/*/head.safetensors'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.3'
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.lock
            ai-service/requirements-dev.lock
            ai-service/requirements-laya.txt

      # Same hash-locked set as the image (torch from the CPU index; the
      # hashes rule out the CUDA build), plus the test tools. laya is the
      # pinned commit, built without isolation against the locked setuptools.
      - name: Install CPU dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            --extra-index-url https://download.pytorch.org/whl/cpu -r ai-service/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -r ai-service/requirements-laya.txt
          python -m pip check

      - name: Read pinned base revision
        id: base
        run: |
          echo "revision=$(jq -er .revision ai-service/training/base-lock.json)" >>"$GITHUB_OUTPUT"
          echo "LAYA_BASE=$RUNNER_TEMP/laya-base" >>"$GITHUB_ENV"

      # Keyed on the pinned Hugging Face revision: a new pin is a new entry.
      - name: Restore pinned base checkpoint
        id: base-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LAYA_BASE }}
          key: laya-base-${{ steps.base.outputs.revision }}

      # snapshot_download at the pinned commit, then sha256 of every locked
      # file (training/upstream.py); the only networked step of the job.
      - name: Fetch pinned base checkpoint
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: python ai-service/training/upstream.py --output "$LAYA_BASE"

      # Saved straight after the verified download, so a later failure in
      # this job does not cost another 650 MB fetch on the next run.
      - name: Save pinned base checkpoint
        if: steps.base-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LAYA_BASE }}
          key: laya-base-${{ steps.base.outputs.revision }}

      # A cache entry is not trusted by its key alone.
      - name: Verify pinned base checksums
        run: python -c 'import sys; from pathlib import Path; from upstream import verify_base; verify_base(Path(sys.argv[1]))' "$LAYA_BASE"

      # Composes every committed artifact exactly as the image does (refusing
      # any result that differs from the manifest), then requires
      # verify_artifact to accept it if and only if it is release-approved.
      - name: Compose artifacts and check the release gate
        id: artifact
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python .github/workflows/scripts/local_ai_artifact.py verify --base "$LAYA_BASE" --work "$RUNNER_TEMP/local-ai-composed"

      # An unapproved checkpoint is a release blocker, not a test failure:
      # release.yml refuses to tag or publish the chart, docker-build pushes
      # no image for a tag, and the Dockerfile refuses to build it at all.
      - name: Report unapproved checkpoint
        if: steps.artifact.outputs.approved != 'true'
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          REASON: ${{ steps.artifact.outputs.reason }}
        run: |
          echo "### Local AI checkpoint not release-approved" >>"$GITHUB_STEP_SUMMARY"
          echo "\`$VERSION\`: $REASON Bundled-inference tests are skipped; the local-ai image cannot be built or released until manifest.json and cpu-evaluation.json say release_approved on cpu." >>"$GITHUB_STEP_SUMMARY"

      - name: Generate controlled dataset
        run: python ai-service/training/generate.py --output ai-service/artifacts/dataset

      # The approval run's CPU evaluation happened on the developer's machine;
      # the image runs linux/amd64, whose qnnpack int8 kernels differ. This
      # runner is linux/amd64 with the image's locked torch wheel, so re-score
      # the held-out partition here through the image's Runtime and require the
      # release gate to hold on the deployment platform too.
      - name: Reproduce the CPU release gate on linux/amd64
        if: steps.artifact.outputs.approved == 'true'
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          COMPOSED: ${{ steps.artifact.outputs.composed }}
        run: python .github/workflows/scripts/local_ai_artifact.py reproduce --composed "$COMPOSED" --data ai-service/artifacts/dataset

      # PROBARA_LAYA_BASE runs the real-base reproduction test. Runtime
      # refuses an unapproved checkpoint by design, so LOCAL_AI_ARTIFACT (the
      # bundled-inference test) is set only for an approved one.
      - name: Contract, packaging, artifact, CI helper and CPU inference tests
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PROBARA_LAYA_BASE: ${{ env.LAYA_BASE }}
          LOCAL_AI_ARTIFACT: ${{ steps.artifact.outputs.approved == 'true' && steps.artifact.outputs.composed || '' }}
        run: python -m pytest ai-service/tests .github/workflows/scripts -q -rs
