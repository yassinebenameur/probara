name: Build and Test

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  go-format:
    name: Go formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: make fmt

  go-test:
    name: Go test (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main module
            directory: .
            go-version-file: go.mod
            dependency-path: go.sum
            coverage-file: coverage-main.out
            coverage-flag: main

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.go-version-file }}
          cache-dependency-path: ${{ matrix.dependency-path }}

      - name: Download dependencies
        working-directory: ${{ matrix.directory }}
        run: go mod download

      - name: Run go vet
        working-directory: ${{ matrix.directory }}
        run: go vet ./...

      - name: Run tests
        working-directory: ${{ matrix.directory }}
        run: go test -v -race -coverprofile="${{ github.workspace }}/${{ matrix.coverage-file }}" ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: ./${{ matrix.coverage-file }}
          flags: ${{ matrix.coverage-flag }}
          fail_ci_if_error: false

  frontend:
    name: Frontend (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: operator UI
            directory: web
            lockfile: web/package-lock.json
          - name: website
            directory: website
            lockfile: website/package-lock.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Run lint
        working-directory: ${{ matrix.directory }}
        run: npm run lint

      - name: Run typecheck
        working-directory: ${{ matrix.directory }}
        run: npm exec -- tsc --noEmit

      - name: Run production build
        working-directory: ${{ matrix.directory }}
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
