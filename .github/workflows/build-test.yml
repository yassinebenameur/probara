name: Build and Test

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Test dependency selection
    runs-on: ubuntu-latest
    outputs:
      ai_validation: ${{ steps.changes.outputs.ai_validation }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false
      - name: Select expensive validation
        id: changes
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/workflows/scripts/ci.py changes --event "$CI_EVENT" --base "$CI_BASE" --head "$CI_HEAD"

  go-format:
    # Preserve the existing check name for branch protection.
    name: Go formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make fmt
      - run: go vet ./...
      - name: Check CI selection and reporting
        run: python3 -m unittest discover -s .github/workflows/scripts -p test_ci.py -v

  go-unit:
    name: Go fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A mistakenly included Docker test must not quietly work on this runner.
      DOCKER_HOST: unix:///tmp/probara-unit-no-docker.sock
      PROBARA_TEST_POSTGRES_DSN: ''
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go mod download
      - name: Run fast suite with race detection
        shell: bash
        run: go test -json -tags=unit -race -count=1 -timeout=10m ./... 2>&1 | tee "$RUNNER_TEMP/go-unit.jsonl"
      - name: Summarize cases and package timings
        if: always()
        run: python3 .github/workflows/scripts/ci.py go-report "$RUNNER_TEMP/go-unit.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-log-unit
          path: ${{ runner.temp }}/go-unit.jsonl
          retention-days: 7

  go-full:
    name: Go full tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [api, alerting-worker, platform]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: probara
          POSTGRES_PASSWORD: probara
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Each fixture creates and drops its own database on this job's server.
      PROBARA_TEST_POSTGRES_DSN: postgres://probara:probara@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go mod download
      - name: Verify browser dependency
        if: matrix.shard == 'alerting-worker'
        run: command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Select package group
        run: python3 .github/workflows/scripts/ci.py packages --shard '${{ matrix.shard }}' > "$RUNNER_TEMP/packages.txt"
      - name: Run full suite group with race detection and coverage
        shell: bash
        run: |
          mapfile -t packages < "$RUNNER_TEMP/packages.txt"
          go test -json -race -count=1 -p 2 -timeout=15m -coverprofile="coverage-${{ matrix.shard }}.out" "${packages[@]}" 2>&1 | tee "$RUNNER_TEMP/go-${{ matrix.shard }}.jsonl"
      - name: Summarize cases and package timings
        if: always()
        run: python3 .github/workflows/scripts/ci.py go-report "$RUNNER_TEMP/go-${{ matrix.shard }}.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-${{ matrix.shard }}.jsonl
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.out
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: operator UI
            directory: web
            lockfile: web/package-lock.json
          - name: website
            directory: website
            lockfile: website/package-lock.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # LFS bandwidth is metered; only the local-ai job needs the model files.
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Run lint
        working-directory: ${{ matrix.directory }}
        run: npm run lint

      - name: Run typecheck
        working-directory: ${{ matrix.directory }}
        run: npm exec -- tsc --noEmit

      - name: Run unit tests
        if: matrix.directory == 'web'
        working-directory: ${{ matrix.directory }}
        run: npm test

      - name: Run production build
        working-directory: ${{ matrix.directory }}
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  ai-fast:
    name: AI fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ai-service:ai-service/training
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.3'
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.lock
            ai-service/requirements-dev.lock
            ai-service/requirements-laya.txt
      - name: Install actual test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            --extra-index-url https://download.pytorch.org/whl/cpu -r ai-service/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -r ai-service/requirements-laya.txt
          python -m pip check
      - name: Generate controlled dataset
        run: python ai-service/training/generate.py --output ai-service/artifacts/dataset
      - name: Test contracts, packaging, server and synthetic fixtures
        run: python -m pytest ai-service/tests .github/workflows/scripts -m 'not checkpoint' --strict-markers -q -rs

  ai-checkpoint:
    name: AI checkpoint validation
    needs: changes
    if: needs.changes.outputs.ai_validation == 'true'
    runs-on: ubuntu-latest
    # An approved checkpoint adds the held-out reproduction (2000 int8 CPU
    # decisions) on top of the base fetch and composition.
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ai-service:ai-service/training
    steps:
      # The only job here that needs Git LFS: the committed decision heads
      # (ai-service/artifacts/*/head.safetensors, the sole LFS pattern).
      # LFS bandwidth is metered and this job runs on every push, so the
      # objects are cached by their oids and pulled only when a head changes.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: List Git LFS objects
        id: lfs
        run: echo "key=$(git lfs ls-files --long | sort | sha256sum | cut -c1-32)" >>"$GITHUB_OUTPUT"

      - name: Restore Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: local-ai-lfs-${{ steps.lfs.outputs.key }}

      # Checksums are re-checked against manifest.json by the compose step.
      - name: Pull Git LFS head weights
        run: git lfs pull --include 'ai-service/artifacts/*/head.safetensors'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.3'
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.lock
            ai-service/requirements-dev.lock
            ai-service/requirements-laya.txt

      # Same hash-locked set as the image (torch from the CPU index; the
      # hashes rule out the CUDA build), plus the test tools. laya is the
      # pinned commit, built without isolation against the locked setuptools.
      - name: Install CPU dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            --extra-index-url https://download.pytorch.org/whl/cpu -r ai-service/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -r ai-service/requirements-laya.txt
          python -m pip check

      - name: Read pinned base revision
        id: base
        run: |
          echo "revision=$(jq -er .revision ai-service/training/base-lock.json)" >>"$GITHUB_OUTPUT"
          echo "LAYA_BASE=$RUNNER_TEMP/laya-base" >>"$GITHUB_ENV"

      # Keyed on the pinned Hugging Face revision: a new pin is a new entry.
      - name: Restore pinned base checkpoint
        id: base-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LAYA_BASE }}
          key: laya-base-${{ steps.base.outputs.revision }}

      # snapshot_download at the pinned commit, then sha256 of every locked
      # file (training/upstream.py); the only networked step of the job.
      - name: Fetch pinned base checkpoint
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: python ai-service/training/upstream.py --output "$LAYA_BASE"

      # Saved straight after the verified download, so a later failure in
      # this job does not cost another 650 MB fetch on the next run.
      - name: Save pinned base checkpoint
        if: steps.base-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LAYA_BASE }}
          key: laya-base-${{ steps.base.outputs.revision }}

      # A cache entry is not trusted by its key alone.
      - name: Verify pinned base checksums
        run: python -c 'import sys; from pathlib import Path; from upstream import verify_base; verify_base(Path(sys.argv[1]))' "$LAYA_BASE"

      # Composes every committed artifact exactly as the image does (refusing
      # any result that differs from the manifest), then requires
      # verify_artifact to accept it if and only if it is release-approved.
      - name: Compose artifacts and check the release gate
        id: artifact
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python .github/workflows/scripts/local_ai_artifact.py verify --base "$LAYA_BASE" --work "$RUNNER_TEMP/local-ai-composed"

      # An unapproved checkpoint is a release blocker, not a test failure:
      # release.yml refuses to tag or publish the chart, docker-build pushes
      # no image for a tag, and the Dockerfile refuses to build it at all.
      - name: Report unapproved checkpoint
        if: steps.artifact.outputs.approved != 'true'
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          REASON: ${{ steps.artifact.outputs.reason }}
        run: |
          echo "### Local AI checkpoint not release-approved" >>"$GITHUB_STEP_SUMMARY"
          echo "\`$VERSION\`: $REASON Bundled-inference tests are skipped; the local-ai image cannot be built or released until manifest.json and cpu-evaluation.json say release_approved on cpu." >>"$GITHUB_STEP_SUMMARY"

      - name: Generate controlled dataset
        run: python ai-service/training/generate.py --output ai-service/artifacts/dataset

      # PROBARA_LAYA_BASE runs the real-base reproduction test. Runtime
      # refuses an unapproved checkpoint by design, so LOCAL_AI_ARTIFACT (the
      # bundled-inference test) is set only for an approved one.
      - name: Real checkpoint tests
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PROBARA_LAYA_BASE: ${{ env.LAYA_BASE }}
          LOCAL_AI_ARTIFACT: ${{ steps.artifact.outputs.approved == 'true' && steps.artifact.outputs.composed || '' }}
        run: python -m pytest ai-service/tests -m checkpoint --strict-markers -q -rs

      # The approval run's CPU evaluation happened on the developer's machine;
      # the image runs linux/amd64, whose qnnpack int8 kernels differ. This
      # runner is linux/amd64 with the image's locked torch wheel, so re-score
      # the held-out partition here through the image's Runtime and require the
      # release gate to hold on the deployment platform too.
      - name: Reproduce the CPU release gate on linux/amd64
        if: steps.artifact.outputs.approved == 'true'
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          COMPOSED: ${{ steps.artifact.outputs.composed }}
        run: python .github/workflows/scripts/local_ai_artifact.py reproduce --composed "$COMPOSED" --data ai-service/artifacts/dataset


  go-test:
    # Preserve the former required Go check without waiting for unrelated AI work.
    name: Go test (main module)
    if: always()
    needs: [go-format, go-unit, go-full]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: Verify all required results
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/workflows/scripts/ci.py required-results --suite go
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-parts
          merge-multiple: true
      - name: Merge complete coverage
        run: python3 .github/workflows/scripts/ci.py merge-coverage coverage-parts coverage-main.out
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage-main.out
          flags: main
          fail_ci_if_error: false

  local-ai:
    # The existing required AI status covers fast checks and selected validation.
    name: Bundled CPU AI
    if: always()
    needs: [changes, ai-fast, ai-checkpoint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: Verify selected AI results
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/workflows/scripts/ci.py required-results --suite ai
