# Release install: prebuilt images from GHCR instead of builds from source,
# plus the frontend. It is an override of docker-compose.yml, so the service
# wiring stays in one file (and in step with the Helm chart):
#
#   docker compose -f docker-compose.yml -f docker-compose.release.yml up -d
#
# scripts/install.sh downloads both files at a release tag and writes a .env
# with generated secrets and COMPOSE_FILE naming both files, so plain
# `docker compose ...` in that directory uses them. It never overwrites a
# value already in .env.
#
# Every credential here is required (${VAR:?...}): release mode has no
# development defaults. Needs Docker Compose 2.24.4 or newer (!reset,
# !override).
#
# Published ports: the UI (3000, through the `edge` proxy) and status pages
# (8082). The API is reached through the UI's /api proxy; PostgreSQL, NATS
# client/monitoring, the frontend itself and every metrics port stay on the
# Compose network. The NATS websocket listener is
# published on loopback only, for a TLS reverse proxy on 443 to front (see the
# private-location docs).

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (scripts/install.sh generates .env)}"
    ports: !reset []

  # Auth on: platform services log in as probara-platform (password passed as
  # a --pass argument, never through nats.conf variable expansion, which
  # re-parses the value as config); every other client, i.e. private-location
  # workers, goes through the API-hosted auth callout, on 4222 and on the
  # websocket listener alike.
  nats:
    command: !override
      - "-c"
      - "/etc/nats/nats.conf"
      - "--user"
      - "probara-platform"
      - "--pass"
      - "${NATS_PLATFORM_PASSWORD:?NATS_PLATFORM_PASSWORD is required (scripts/install.sh generates .env)}"
    configs: !override
      - source: nats_release_conf
        target: /etc/nats/nats.conf
    ports: !override
      - "${NATS_WEBSOCKET_PUBLISH:-127.0.0.1:8443}:8443"

  migrations:
    build: !reset null
    image: "${PROBARA_IMAGE_REPOSITORY:-ghcr.io/yassinebenameur/probara}-migrations:${PROBARA_VERSION:?PROBARA_VERSION is required (a release such as 2.0.0)}"
    # The image carries the migrations of its own release.
    volumes: !reset []

  # amd64 only. Started through the local-ai profile, which install.sh puts in
  # COMPOSE_PROFILES on amd64 hosts; arm64 hosts get LOCAL_AI_DISABLED=true.
  local-ai:
    build: !reset null
    image: "${LOCAL_AI_IMAGE:-ghcr.io/yassinebenameur/probara-local-ai:${PROBARA_VERSION:?PROBARA_VERSION is required}}"
    profiles: ["local-ai"]
    environment:
      LOCAL_AI_TOKEN: "${LOCAL_AI_TOKEN:?LOCAL_AI_TOKEN is required (scripts/install.sh generates .env)}"

  api:
    build: !reset null
    image: "${PROBARA_IMAGE_REPOSITORY:-ghcr.io/yassinebenameur/probara}-api:${PROBARA_VERSION:?PROBARA_VERSION is required}"
    environment:
      NATS_URL: "nats://probara-platform:${NATS_PLATFORM_PASSWORD:?NATS_PLATFORM_PASSWORD is required}@nats:4222"
      PROBARA_SECRETS_KEY: "${PROBARA_SECRETS_KEY:?PROBARA_SECRETS_KEY is required (scripts/install.sh generates .env)}"
      LOCAL_AI_TOKEN: "${LOCAL_AI_TOKEN:?LOCAL_AI_TOKEN is required}"
      STATUS_PAGE_PREVIEW_SECRET: "${STATUS_PAGE_PREVIEW_SECRET:?STATUS_PAGE_PREVIEW_SECRET is required (scripts/install.sh generates .env)}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      # Off until the UI is served over HTTPS; a Secure cookie never comes
      # back over plain http://host:3000.
      ADMIN_COOKIE_SECURE: "${ADMIN_COOKIE_SECURE:-false}"
      # Auth-callout issuer (an nkey account seed; the broker holds only its
      # public key, nats_release_conf below).
      NATS_LOCATION_AUTH_ISSUER_SEED: "${NATS_LOCATION_AUTH_ISSUER_SEED:?NATS_LOCATION_AUTH_ISSUER_SEED is required (scripts/install.sh generates .env)}"
      # wss://... (or tls://...) address private-location workers dial; empty
      # disables the deploy snippets. See the private-location docs.
      PUBLIC_NATS_URL: "${PUBLIC_NATS_URL:-}"
      # Every browser request reaches the API through the frontend's /api
      # proxy. Trusting this network (and nothing else: the API publishes no
      # port) lets the API read the client IP that `edge` resolved, so rate
      # limits and the login throttle key on real clients, not the frontend.
      TRUSTED_PROXY_CIDRS: "${PROBARA_NETWORK_SUBNET:-172.31.213.0/24}"
    ports: !reset []

  scheduler:
    build: !reset null
    image: "${PROBARA_IMAGE_REPOSITORY:-ghcr.io/yassinebenameur/probara}-scheduler:${PROBARA_VERSION:?PROBARA_VERSION is required}"
    environment:
      NATS_URL: "nats://probara-platform:${NATS_PLATFORM_PASSWORD:?NATS_PLATFORM_PASSWORD is required}@nats:4222"
      PROBARA_SECRETS_KEY: "${PROBARA_SECRETS_KEY:?PROBARA_SECRETS_KEY is required}"
    ports: !reset []

  worker:
    build: !reset null
    image: "${PROBARA_IMAGE_REPOSITORY:-ghcr.io/yassinebenameur/probara}-worker:${PROBARA_VERSION:?PROBARA_VERSION is required}"
    environment:
      NATS_URL: "nats://probara-platform:${NATS_PLATFORM_PASSWORD:?NATS_PLATFORM_PASSWORD is required}@nats:4222"
      PROBARA_SECRETS_KEY: "${PROBARA_SECRETS_KEY:?PROBARA_SECRETS_KEY is required}"
      LOCAL_AI_TOKEN: "${LOCAL_AI_TOKEN:?LOCAL_AI_TOKEN is required}"
      # Development convenience only (rewrites loopback SIP targets).
      SIP_LOCALHOST_AS_HOST_GATEWAY: "false"
    ports: !reset []

  status-page:
    build: !reset null
    image: "${PROBARA_IMAGE_REPOSITORY:-ghcr.io/yassinebenameur/probara}-status-page:${PROBARA_VERSION:?PROBARA_VERSION is required}"
    environment:
      NATS_URL: "nats://probara-platform:${NATS_PLATFORM_PASSWORD:?NATS_PLATFORM_PASSWORD is required}@nats:4222"
      STATUS_PAGE_PREVIEW_SECRET: "${STATUS_PAGE_PREVIEW_SECRET:?STATUS_PAGE_PREVIEW_SECRET is required}"
    ports: !override
      - "${PROBARA_STATUS_PAGE_PORT:-8082}:8082"

  alerter:
    build: !reset null
    image: "${PROBARA_IMAGE_REPOSITORY:-ghcr.io/yassinebenameur/probara}-alerter:${PROBARA_VERSION:?PROBARA_VERSION is required}"
    environment:
      NATS_URL: "nats://probara-platform:${NATS_PLATFORM_PASSWORD:?NATS_PLATFORM_PASSWORD is required}@nats:4222"
      PROBARA_SECRETS_KEY: "${PROBARA_SECRETS_KEY:?PROBARA_SECRETS_KEY is required}"
    ports: !reset []

  # The operator UI. Its server-side /api proxy forwards to the API on the
  # Compose network. It is reachable only through `edge`, which is why it may
  # forward X-Forwarded-For: Next.js keeps a client-supplied X-Forwarded-For
  # (it fills the header from the socket only when absent), so a directly
  # published frontend with this flag would let clients pick their own IP.
  frontend:
    image: "${PROBARA_IMAGE_REPOSITORY:-ghcr.io/yassinebenameur/probara}-frontend:${PROBARA_VERSION:?PROBARA_VERSION is required}"
    container_name: probara-frontend
    environment:
      API_PROXY_TARGET: "http://api:8080"
      API_PROXY_TRUST_FORWARDED_FOR: "true"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - probara-network
    restart: unless-stopped

  # The one published UI entrypoint. Caddy replaces X-Forwarded-For with the
  # client it resolves ({client_ip}): the TCP peer, or, when the peer is one
  # of PROBARA_TRUSTED_PROXIES (space-separated CIDRs of your own TLS proxy or
  # load balancer), the rightmost untrusted address of the incoming chain. A
  # client-sent X-Forwarded-For or X-Real-IP never gets past it.
  edge:
    image: caddy:2.11.4-alpine
    container_name: probara-edge
    environment:
      PROBARA_TRUSTED_PROXIES: "${PROBARA_TRUSTED_PROXIES:-}"
    configs:
      - source: edge_caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "${PROBARA_UI_PORT:-3000}:3000"
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - probara-network
    restart: unless-stopped

# Fixed so the API can trust exactly this network (TRUSTED_PROXY_CIDRS above).
# Change PROBARA_NETWORK_SUBNET if it collides with a network on the host.
networks:
  probara-network:
    ipam:
      config:
        - subnet: "${PROBARA_NETWORK_SUBNET:-172.31.213.0/24}"

configs:
  edge_caddyfile:
    content: |
      {
      	admin off
      	servers {
      		trusted_proxies static {$$PROBARA_TRUSTED_PROXIES:127.0.0.1/32}
      		trusted_proxies_strict
      	}
      }
      :3000 {
      	reverse_proxy frontend:3000 {
      		header_up X-Forwarded-For {client_ip}
      		header_up -X-Real-IP
      	}
      }
  # Same listeners as the development nats_conf, plus authorization. The
  # issuer public key is public by construction; the platform password is
  # deliberately not here (see the nats service above).
  nats_release_conf:
    content: |
      jetstream {
        store_dir: /data
      }
      http_port: 8222
      websocket {
        port: 8443
        no_tls: true
      }
      authorization {
        auth_callout {
          issuer: "${NATS_LOCATION_AUTH_ISSUER_PUBLIC_KEY:?NATS_LOCATION_AUTH_ISSUER_PUBLIC_KEY is required (scripts/install.sh generates .env)}"
          auth_users: ["probara-platform"]
        }
      }
