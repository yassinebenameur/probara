services:
  # Infrastructure services
  postgres:
    image: postgres:16-alpine
    container_name: probara-postgres
    environment:
      POSTGRES_USER: probara
      POSTGRES_PASSWORD: probara
      POSTGRES_DB: probara
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probara"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - probara-network

  nats:
    image: nats:2.10-alpine
    container_name: probara-nats
    command:
      - "-js"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - probara-network

  # Database migrations
  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    container_name: probara-migrations
    environment:
      POSTGRES_URL: "postgres://probara:probara@postgres:5432/probara?sslmode=disable"
    volumes:
      - ./shared/db/migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - probara-network
    restart: "no"

  # Application services
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: probara-api
    environment:
      HTTP_PORT: "8080"
      METRICS_PORT: "9090"
      LOG_LEVEL: "info"
      POSTGRES_URL: "postgres://probara:probara@postgres:5432/probara?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      ADMIN_JWT_SECRET: "your-secret-key-change-in-production"
      ADMIN_ACCESS_TTL_MINUTES: "15"
      ADMIN_REFRESH_TTL_DAYS: "30"
      ADMIN_COOKIE_SECURE: "false"
      SYNTHETIC_BROWSER_ARTIFACTS_DIR: "/artifacts/synthetic-browser"
      # Shared with the status-page service; see its definition below.
      STATUS_PAGE_PREVIEW_SECRET: "${STATUS_PAGE_PREVIEW_SECRET:-}"
      # OIDC SSO (off by default; `docker compose --profile sso up` starts a
      # dex test IdP matching these values — see infra/dex/config.yaml).
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-http://localhost:5556/dex}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-probara}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-probara-dex-secret}"
      OIDC_REDIRECT_URL: "${OIDC_REDIRECT_URL:-http://localhost:3000/api/v1/auth/oidc/callback}"
      AUDIT_RETENTION_DAYS: "${AUDIT_RETENTION_DAYS:-365}"
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - synthetic_artifacts:/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - probara-network
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    container_name: probara-scheduler
    environment:
      HTTP_PORT: "8081"
      METRICS_PORT: "9091"
      LOG_LEVEL: "info"
      POSTGRES_URL: "postgres://probara:probara@postgres:5432/probara?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      CHECK_JOB_STREAM: "check-jobs"
      CHECK_JOB_SUBJECT: "check.job"
      SCHEDULE_INTERVAL_SECONDS: "5"
      RETENTION_CLEANUP_ENABLED: "true"
      RETENTION_CLEANUP_HOUR_UTC: "2"
      RETENTION_CLEANUP_BATCH_SIZE: "5000"
      RETENTION_CLEANUP_MAX_ROWS_PER_RUN: "200000"
    ports:
      - "8081:8081"
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - probara-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: probara-worker
    environment:
      HTTP_PORT: "8083"
      METRICS_PORT: "9092"
      LOG_LEVEL: "info"
      POSTGRES_URL: "postgres://probara:probara@postgres:5432/probara?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      CHECK_JOB_STREAM: "check-jobs"
      CHECK_JOB_SUBJECT: "check.job"
      NATS_CONSUMER_NAME: "worker"
      WORKER_CONCURRENCY: "10"
      CHROME_BIN: "/usr/bin/chromium-browser"
      SYNTHETIC_BROWSER_ARTIFACTS_DIR: "/artifacts/synthetic-browser"
      SIP_LOCALHOST_AS_HOST_GATEWAY: "true"
    ports:
      - "9092:9092"
    volumes:
      - synthetic_artifacts:/artifacts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9092/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - probara-network
    restart: unless-stopped
    user: "0:0"
    shm_size: "1gb"
    # Scale workers if needed
    deploy:
      replicas: 1

  # Example private-location worker. To try multi-location checks locally:
  #   1. Create a location in the UI (Locations page) and copy its UUID.
  #   2. Paste it into WORKER_LOCATION_ID below and uncomment the service.
  # Location workers are NATS-only: no POSTGRES_URL — results travel back over
  # NATS and are persisted by the scheduler-side ingest consumer.
  # worker-location-example:
  #   build:
  #     context: .
  #     dockerfile: worker/Dockerfile
  #   container_name: probara-worker-location-example
  #   environment:
  #     HTTP_PORT: "8085"
  #     METRICS_PORT: "9095"
  #     LOG_LEVEL: "info"
  #     NATS_URL: "nats://nats:4222"
  #     CHECK_JOB_STREAM: "check-jobs"
  #     CHECK_JOB_SUBJECT: "check.job"
  #     NATS_CONSUMER_NAME: "worker"
  #     WORKER_LOCATION_ID: "<location-uuid-from-the-locations-page>"
  #     WORKER_CONCURRENCY: "10"
  #   depends_on:
  #     nats:
  #       condition: service_healthy
  #   networks:
  #     - probara-network
  #   restart: unless-stopped

  status-page:
    build:
      context: .
      dockerfile: status-page/Dockerfile
    container_name: probara-status-page
    environment:
      HTTP_PORT: "8082"
      METRICS_PORT: "9093"
      LOG_LEVEL: "info"
      POSTGRES_URL: "postgres://probara:probara@postgres:5432/probara?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      STATUS_PAGE_BASE_URL: "http://localhost:8082"
      STATUS_PAGE_API_BASE_URL: "http://api:8080"
      # Shared with the api service; gates draft-template previews with a
      # token minted by the API. Leave unset to allow open previews (dev).
      STATUS_PAGE_PREVIEW_SECRET: "${STATUS_PAGE_PREVIEW_SECRET:-}"
    ports:
      - "8082:8082"
      - "9093:9093"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - probara-network
    restart: unless-stopped

  alerter:
    build:
      context: .
      dockerfile: alerter/Dockerfile
    container_name: probara-alerter
    environment:
      HTTP_PORT: "8084"
      METRICS_PORT: "9094"
      LOG_LEVEL: "info"
      POSTGRES_URL: "postgres://probara:probara@postgres:5432/probara?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      ALERT_STREAM: "ALERTS"
      ALERT_SUBJECT: "alerts"
      ALERT_EVAL_INTERVAL_SECONDS: "30"
      ALERT_REMINDER_INTERVAL_SECONDS: "3600"
      ALERT_GROUP_WINDOW_SECONDS: "60"
      ALERT_GROUP_MAX_CHILDREN: "5"
    ports:
      - "9094:9094"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9094/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - probara-network
    restart: unless-stopped

  # Test OIDC IdP for SSO development: docker compose --profile sso up
  # Log in as admin@example.com / password (see infra/dex/config.yaml).
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: probara-dex
    profiles: ["sso"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./infra/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"
    networks:
      - probara-network
    restart: unless-stopped

volumes:
  postgres_data:
  nats_data:
  synthetic_artifacts:

networks:
  probara-network:
    driver: bridge
