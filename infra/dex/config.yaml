# dex test IdP for local OIDC development (docker compose --profile sso up).
#
# Issuer is http://localhost:5556/dex, which works when the API runs on the
# host (scripts/start-local-services.sh — the standard dev workflow): both the
# API process and the browser resolve localhost:5556 to the mapped dex port.
# For a fully containerized API, override OIDC_ISSUER_URL to
# http://host.docker.internal:5556/dex.
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

staticClients:
  - id: probara
    name: Probara
    secret: probara-dex-secret
    redirectURIs:
      - http://localhost:3000/api/v1/auth/oidc/callback
      # Direct-to-API callback (bypassing the Next.js proxy) for curl testing.
      - http://localhost:8080/api/v1/auth/oidc/callback

oauth2:
  skipApprovalScreen: true

enablePasswordDB: true

# staticPasswords users carry NO groups — to exercise group→role mappings
# pick "Mock (groups test)" on dex's login screen: the mockCallback connector
# returns a fixed identity (Kilgore Trout) with groups ["authors"]. Map the
# "authors" group in Settings → OIDC group mappings and set
# OIDC_SCOPES="openid profile email groups" in .env.
connectors:
  - type: mockCallback
    id: mock
    name: Mock (groups test)

staticPasswords:
  # password is "password" (bcrypt)
  - email: admin@example.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: admin
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
  - email: viewer@example.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: viewer
    userID: 41331323-6f44-45e6-b3b9-2c4b60c02be5
