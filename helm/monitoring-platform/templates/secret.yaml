apiVersion: v1
kind: Secret
metadata:
  name: {{ include "monitoring-platform.fullname" . }}-secret
  labels:
    {{- include "monitoring-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  # PostgreSQL credentials
  postgresql_username: "{{ .Values.postgresql.auth.username }}"
  postgresql_password: "{{ .Values.postgresql.auth.password }}"
  postgresql_database: "{{ .Values.postgresql.auth.database }}"
  
  # Full PostgreSQL connection URL
  postgres_url: {{ include "monitoring-platform.postgresUrl" . | quote }}
  
  # JWT secret for API authentication
  admin_jwt_secret: "{{ .Values.secrets.adminJwtSecret }}"
  
  # Initial API key for first login
  initial_api_key: "{{ .Values.secrets.initialApiKey }}"
  {{- if .Values.secrets.probaraSecretsKey }}

  # AES-256 key (32 bytes, base64) for at-rest encryption of monitor/channel
  # config secrets. Used by api, worker, and alerter.
  probara_secrets_key: "{{ .Values.secrets.probaraSecretsKey }}"
  {{- end }}
