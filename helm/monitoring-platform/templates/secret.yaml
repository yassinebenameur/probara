apiVersion: v1
{{- if and .Values.api.publicNatsURL (not .Values.nats.auth.enabled) }}
{{- fail "nats.auth.enabled must be true when api.publicNatsURL is set" }}
{{- end }}
{{- if and .Values.nats.auth.enabled (not .Values.secrets.probaraSecretsKey) }}
{{- fail "secrets.probaraSecretsKey is required when nats.auth.enabled" }}
{{- end }}
kind: Secret
metadata:
  name: {{ include "monitoring-platform.fullname" . }}-secret
  labels:
    {{- include "monitoring-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Kept in a Secret because the URL contains the internal platform credential
  # when NATS authorization callout is enabled.
  nats_url: {{ include "monitoring-platform.natsUrl" . | quote }}
  {{- if .Values.nats.auth.enabled }}
  nats_location_auth_issuer_seed: {{ required "nats.auth.locationIssuerSeed is required when nats.auth.enabled" .Values.nats.auth.locationIssuerSeed | quote }}
  {{- end }}
  # PostgreSQL credentials
  postgresql_username: "{{ .Values.postgresql.auth.username }}"
  postgresql_password: "{{ .Values.postgresql.auth.password }}"
  postgresql_database: "{{ .Values.postgresql.auth.database }}"
  
  # Full PostgreSQL connection URL
  postgres_url: {{ include "monitoring-platform.postgresUrl" . | quote }}
  
  # JWT secret for API authentication
  admin_jwt_secret: "{{ .Values.secrets.adminJwtSecret }}"
  
  # Initial API key for first login
  initial_api_key: "{{ .Values.secrets.initialApiKey }}"
  {{- if .Values.secrets.probaraSecretsKey }}

  # AES-256 key (32 bytes, base64) for at-rest encryption of monitor/channel
  # config secrets. Used by api, worker, and alerter.
  probara_secrets_key: "{{ .Values.secrets.probaraSecretsKey }}"
  {{- end }}
  {{- if .Values.secrets.oidcClientSecret }}

  # OIDC client secret for SSO login (api only)
  oidc_client_secret: "{{ .Values.secrets.oidcClientSecret }}"
  {{- end }}
