{{- if .Values.ingress.enabled -}}
{{- $fullName := include "monitoring-platform.fullname" . -}}
{{- $apiPort := .Values.api.httpPort -}}
{{- $frontendPort := .Values.frontend.httpPort -}}
{{- $statusPagePort := .Values.statusPage.httpPort -}}
{{- range .Values.ingress.hosts }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-{{ .host | replace "." "-" }}
  labels:
    {{- include "monitoring-platform.labels" $ | nindent 4 }}
  {{- with $.Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $.Values.ingress.className }}
  ingressClassName: {{ $.Values.ingress.className }}
  {{- end }}
  {{- if $.Values.ingress.tls }}
  tls:
    {{- range $.Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          {{- if $.Values.frontend.enabled }}
          {{- if $.Values.api.enabled }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-api
                port:
                  number: {{ $apiPort }}
          {{- else }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-frontend
                port:
                  number: {{ $frontendPort }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-frontend
                port:
                  number: {{ $frontendPort }}
          {{- else if $.Values.api.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-api
                port:
                  number: {{ $apiPort }}
          {{- end }}
          {{- range .paths }}
          {{- if ne .path "/" }}
          {{- if ne .path "/api" }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullName }}-status-page
                port:
                  number: {{ $statusPagePort }}
          {{- end }}
          {{- end }}
          {{- end }}
{{- end }}
{{- /*
Status page custom domains: one Ingress per verified domain, routing all of
it to the status-page service (which serves only that page there) with the
domain's own TLS Secret. A host that is also an app host above would hand
that host to a status page, so the render fails instead.
*/}}
{{- if and .Values.statusPage.enabled .Values.statusPage.customDomains }}
{{- $appHosts := dict }}
{{- range .Values.ingress.hosts }}
{{- $_ := set $appHosts (lower .host) true }}
{{- end }}
{{- $seen := dict }}
{{- range .Values.statusPage.customDomains }}
{{- if not .host }}
{{- fail "statusPage.customDomains: every entry needs a host" }}
{{- end }}
{{- if not .tlsSecretName }}
{{- fail (printf "statusPage.customDomains: %s needs a tlsSecretName (custom domains are served over TLS)" .host) }}
{{- end }}
{{- if hasKey $appHosts (lower .host) }}
{{- fail (printf "statusPage.customDomains: %s is also in ingress.hosts" .host) }}
{{- end }}
{{- if hasKey $seen (lower .host) }}
{{- fail (printf "statusPage.customDomains: %s is listed twice" .host) }}
{{- end }}
{{- $_ := set $seen (lower .host) true }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-sp-{{ .host | lower | replace "." "-" }}
  labels:
    {{- include "monitoring-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: status-page
  {{- if or $.Values.ingress.annotations $.Values.statusPage.customDomainsClusterIssuer }}
  annotations:
    {{- with $.Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $.Values.statusPage.customDomainsClusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if $.Values.ingress.className }}
  ingressClassName: {{ $.Values.ingress.className }}
  {{- end }}
  tls:
    - hosts:
        - {{ .host | lower | quote }}
      secretName: {{ .tlsSecretName }}
  rules:
    - host: {{ .host | lower | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-status-page
                port:
                  number: {{ $statusPagePort }}
{{- end }}
{{- end }}
{{- end }}
