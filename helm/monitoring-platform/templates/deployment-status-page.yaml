{{- if .Values.statusPage.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-platform.fullname" . }}-status-page
  labels:
    {{- include "monitoring-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: status-page
spec:
  replicas: {{ .Values.statusPage.replicas }}
  selector:
    matchLabels:
      {{- include "monitoring-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: status-page
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "monitoring-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: status-page
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "monitoring-platform.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z {{ include "monitoring-platform.postgresHost" . }} 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
      {{- end }}
      containers:
      - name: status-page
        image: "{{ .Values.image.repository }}-status-page:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["./status-page"]
        ports:
        - name: http
          containerPort: {{ .Values.statusPage.httpPort }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.statusPage.metricsPort }}
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "status-page"
        - name: HTTP_PORT
          value: "{{ .Values.statusPage.httpPort }}"
        - name: METRICS_PORT
          value: "{{ .Values.statusPage.metricsPort }}"
        - name: LOG_LEVEL
          value: "{{ .Values.statusPage.logLevel }}"
        - name: POSTGRES_URL
          value: {{ include "monitoring-platform.postgresUrl" . | quote }}
        {{- if .Values.statusPage.baseUrl }}
        - name: STATUS_PAGE_BASE_URL
          value: "{{ .Values.statusPage.baseUrl }}"
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.statusPage.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
