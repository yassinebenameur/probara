{{- if .Values.statusPage.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-platform.fullname" . }}-status-page
  labels:
    {{- include "monitoring-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: status-page
spec:
  replicas: {{ .Values.statusPage.replicas }}
  selector:
    matchLabels:
      {{- include "monitoring-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: status-page
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "monitoring-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: status-page
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "monitoring-platform.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z {{ include "monitoring-platform.postgresHost" . }} 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
      {{- end }}
      containers:
      - name: status-page
        image: "{{ .Values.image.repository }}-status-page:{{ include "monitoring-platform.imageTag" . }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["./status-page"]
        ports:
        - name: http
          containerPort: {{ .Values.statusPage.httpPort }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.statusPage.metricsPort }}
          protocol: TCP
        env:
        - name: HTTP_PORT
          value: "{{ .Values.statusPage.httpPort }}"
        - name: METRICS_PORT
          value: "{{ .Values.statusPage.metricsPort }}"
        - name: LOG_LEVEL
          value: "{{ .Values.statusPage.logLevel }}"
        {{- include "monitoring-platform.secretEnv" (dict "ctx" . "name" "POSTGRES_URL" "key" "postgres_url" "secret" .Values.postgresql.existingSecret "secretKey" .Values.postgresql.existingSecretKey) | nindent 8 }}
        {{- include "monitoring-platform.secretEnv" (dict "ctx" . "name" "NATS_URL" "key" "nats_url" "secret" .Values.nats.existingSecret "secretKey" .Values.nats.existingSecretKey) | nindent 8 }}
        {{- if .Values.statusPage.baseUrl }}
        - name: STATUS_PAGE_BASE_URL
          value: "{{ .Values.statusPage.baseUrl }}"
        {{- end }}
        # Visitors' email subscription requests are forwarded to the API
        # in-cluster (the API stores subscribers; this service stays
        # read-only).
        - name: STATUS_PAGE_INTERNAL_API_URL
          value: {{ printf "http://%s-api:%v" (include "monitoring-platform.fullname" .) .Values.api.httpPort | quote }}
        {{- if .Values.statusPage.vapid.publicKey }}
        # Rendered as a literal on purpose. The VAPID public key is published
        # inside every status page as the applicationServerKey, so it is not a
        # credential and does not belong in a Secret. Its private half below
        # always goes through secretEnv.
        - name: STATUS_PAGE_VAPID_PUBLIC_KEY
          value: "{{ .Values.statusPage.vapid.publicKey }}"
        {{- end }}
        {{- if .Values.statusPage.vapid.subject }}
        - name: STATUS_PAGE_VAPID_SUBJECT
          value: "{{ .Values.statusPage.vapid.subject }}"
        {{- end }}
        {{- if include "monitoring-platform.hasSecret" (dict "ctx" . "value" .Values.secrets.statusPageVapidPrivateKey "secret" .Values.secrets.statusPageVapidPrivateKeyExistingSecret) }}
        {{- include "monitoring-platform.secretEnv" (dict "ctx" . "name" "STATUS_PAGE_VAPID_PRIVATE_KEY" "key" "status_page_vapid_private_key" "secret" .Values.secrets.statusPageVapidPrivateKeyExistingSecret "secretKey" .Values.secrets.statusPageVapidPrivateKeyExistingSecretKey) | nindent 8 }}
        {{- end }}
        {{- if include "monitoring-platform.hasSecret" (dict "ctx" . "value" .Values.secrets.statusPagePreviewSecret "secret" .Values.secrets.statusPagePreviewSecretExistingSecret) }}
        {{- include "monitoring-platform.secretEnv" (dict "ctx" . "name" "STATUS_PAGE_PREVIEW_SECRET" "key" "status_page_preview_secret" "secret" .Values.secrets.statusPagePreviewSecretExistingSecret "secretKey" .Values.secrets.statusPagePreviewSecretExistingSecretKey "optional" (not .Values.secrets.statusPagePreviewSecretExistingSecret)) | nindent 8 }}
        {{- end }}
        {{- /* Visitor sessions on password and private pages: a per-field
        Secret (must hold the key), the chart-wide Secret (key optional, so
        an older Secret keeps working with those pages closed), or the
        chart-managed Secret with a literal or derived value. */}}
        {{- if or .Values.secrets.statusPageSessionSecretExistingSecret .Values.secrets.existingSecret (include "monitoring-platform.statusPageSessionSecret" .) }}
        {{- include "monitoring-platform.secretEnv" (dict "ctx" . "name" "STATUS_PAGE_SESSION_SECRET" "key" "status_page_session_secret" "secret" .Values.secrets.statusPageSessionSecretExistingSecret "secretKey" .Values.secrets.statusPageSessionSecretExistingSecretKey "optional" (and (not .Values.secrets.statusPageSessionSecretExistingSecret) .Values.secrets.existingSecret)) | nindent 8 }}
        {{- end }}
        {{- with (include "monitoring-platform.statusPageInternalTokenEnv" .) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if or (kindIs "bool" .Values.statusPage.cookieSecure) .Values.statusPage.cookieSecure }}
        - name: STATUS_PAGE_COOKIE_SECURE
          value: {{ toString .Values.statusPage.cookieSecure | quote }}
        {{- end }}
        {{- with (include "monitoring-platform.statusPagePlatformHosts" .) }}
        - name: STATUS_PAGE_PLATFORM_HOSTS
          value: {{ . | quote }}
        {{- end }}
        {{- if .Values.statusPage.trustForwardedHost }}
        - name: STATUS_PAGE_TRUST_FORWARDED_HOST
          value: "true"
        {{- end }}
        {{- include "monitoring-platform.edgeEnv" (dict "ctx" . "component" "status-page") | nindent 8 }}
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.statusPage.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.statusPage.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
