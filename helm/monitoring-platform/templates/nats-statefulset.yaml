{{- if .Values.nats.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "monitoring-platform.fullname" . }}-nats
  labels:
    {{- include "monitoring-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  serviceName: {{ include "monitoring-platform.fullname" . }}-nats
  replicas: 1
  selector:
    matchLabels:
      {{- include "monitoring-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        {{- include "monitoring-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nats
    spec:
      containers:
        - name: nats
          image: "{{ .Values.nats.image }}"
          imagePullPolicy: IfNotPresent
          args:
            {{- if .Values.nats.auth.enabled }}
            - "-c"
            - "/etc/nats/nats.conf"
            {{- else }}
            - "-js"
            - "-m"
            - "8222"
            - "-sd"
            - "/data"
            {{- end }}
          ports:
            - name: client
              containerPort: 4222
              protocol: TCP
            - name: monitor
              containerPort: 8222
              protocol: TCP
            - name: cluster
              containerPort: 6222
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.nats.auth.enabled }}
            - name: config
              mountPath: /etc/nats
              readOnly: true
            {{- end }}
      {{- if or (not .Values.nats.persistence.enabled) .Values.nats.auth.enabled }}
      volumes:
        {{- if not .Values.nats.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.nats.auth.enabled }}
        - name: config
          configMap:
            name: {{ include "monitoring-platform.fullname" . }}-nats-config
        {{- end }}
      {{- end }}
  {{- if .Values.nats.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.nats.persistence.storageClass }}
        storageClassName: {{ .Values.nats.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.nats.persistence.size }}
  {{- end }}
{{- end }}



