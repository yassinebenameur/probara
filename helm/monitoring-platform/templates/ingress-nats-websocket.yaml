{{- /*
Exposes the embedded broker's websocket listener so private-location workers
connect with wss:// over 443 (TLS terminates here). Only location workers use
it, and each authenticates through the API-hosted auth callout, which is why
the render refuses it without nats.auth.enabled: an ingress in front of an
anonymous broker would hand every job and result subject to the internet.

It is its own Ingress object, never a path added to ingress.yaml's hosts. On
an app host it may only claim a sub-path: "/" there would compete with the
UI's "/" route, so the render refuses it.
*/}}
{{- $ws := .Values.nats.websocket }}
{{- if $ws.ingress.enabled }}
{{- if not .Values.nats.enabled }}
{{- fail "nats.websocket.ingress.enabled exposes the embedded broker; it requires nats.enabled (expose an external broker yourself)" }}
{{- end }}
{{- if not $ws.enabled }}
{{- fail "nats.websocket.ingress.enabled requires nats.websocket.enabled" }}
{{- end }}
{{- if not .Values.nats.auth.enabled }}
{{- fail "nats.websocket.ingress.enabled requires nats.auth.enabled: location workers must authenticate through the auth callout before the broker is reachable from outside the cluster" }}
{{- end }}
{{- $host := required "nats.websocket.ingress.host is required when nats.websocket.ingress.enabled" $ws.ingress.host }}
{{- /* The listener is plaintext and location credentials ride in the
connection: without TLS here the ingress would serve ws:// while the API
advertises wss://. Only an explicit statement that TLS ends in front of the
ingress (a cloud load balancer) lifts this. */}}
{{- if and (not $ws.ingress.tls) (not $ws.ingress.tlsTerminatedUpstream) }}
{{- fail "nats.websocket.ingress.tls is empty: location credentials would cross the network in clear. Add a tls entry, or set nats.websocket.ingress.tlsTerminatedUpstream=true when a load balancer in front of the ingress terminates TLS" }}
{{- end }}
{{- $path := $ws.ingress.path | default "/" }}
{{- if not (hasPrefix "/" $path) }}
{{- fail "nats.websocket.ingress.path must start with /" }}
{{- end }}
{{- if and .Values.ingress.enabled (eq (trimSuffix "/" $path) "") }}
{{- range .Values.ingress.hosts }}
{{- if eq .host $host }}
{{- fail (printf "nats.websocket.ingress.host %s is also an ingress.hosts entry: give the websocket route its own path (for example /nats) or its own host, so it does not take over the UI's / route" $host) }}
{{- end }}
{{- end }}
{{- end }}
{{- $className := $ws.ingress.className | default .Values.ingress.className }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "monitoring-platform.fullname" . }}-nats-websocket
  labels:
    {{- include "monitoring-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
  {{- with $ws.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $className }}
  ingressClassName: {{ $className }}
  {{- end }}
  {{- with $ws.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "monitoring-platform.fullname" . }}-nats
                port:
                  name: websocket
{{- end }}
