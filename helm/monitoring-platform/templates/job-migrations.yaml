{{- if .Values.migrations.enabled }}
{{- /*
The schema migrations run BEFORE an upgrade changes anything (pre-upgrade), so
new pods only ever start against the schema their code needs: several
features read new columns and tables directly and fail, or drop work, on the
old schema. Old pods keep running against the new schema until the rollout
replaces them; migrations stay additive for that window.

A first install has to run them AFTER the manifests (post-install): the
embedded PostgreSQL does not exist before then. An upgrade's database already
does, and a fresh `helm upgrade --install` is an install.

A pre-upgrade hook runs before the release's own Secret is updated, so it
cannot read a postgres_url changed in the same upgrade from there (it would
migrate the old database, or fail on the old password). When the chart
manages the DSN, the Job therefore reads it from its own hook Secret below,
rendered from this upgrade's values and created just before the Job. An
existing Secret named by postgresql.existingSecret or secrets.existingSecret
is the operator's and already holds the value the upgrade will use.
*/}}
{{- $hookSecret := include "monitoring-platform.chartManagedSecret" (dict "ctx" . "secret" .Values.postgresql.existingSecret) }}
{{- if $hookSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "monitoring-platform.fullname" . }}-migrations
  labels:
    {{- include "monitoring-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    # Before the Job (-5), so it exists when the Job's pod starts.
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  postgres_url: {{ include "monitoring-platform.postgresUrl" . | quote }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "monitoring-platform.fullname" . }}-migrations
  labels:
    {{- include "monitoring-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "monitoring-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: OnFailure
      # No release ServiceAccount: the Job only talks to PostgreSQL, and as a
      # pre-upgrade hook it must not depend on an object this upgrade may be
      # the one to create or rename. Nor does it need an API token.
      automountServiceAccountToken: false
      {{- if .Values.postgresql.enabled }}
      initContainers:
        # Wait for embedded PostgreSQL to be ready
        - name: wait-for-postgresql
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z {{ include "monitoring-platform.fullname" . }}-postgresql 5432; do
                echo "PostgreSQL is not ready yet, waiting..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      {{- end }}
      containers:
        - name: migrations
          {{- if .Values.migrations.image.repository }}
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag | default (include "monitoring-platform.imageTag" .) }}"
          {{- else }}
          image: "{{ .Values.image.repository }}-migrations:{{ include "monitoring-platform.imageTag" . }}"
          {{- end }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            {{- if $hookSecret }}
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-migrations" (include "monitoring-platform.fullname" .) | quote }}
                  key: "postgres_url"
            {{- else }}
            {{- include "monitoring-platform.secretEnv" (dict "ctx" . "name" "POSTGRES_URL" "key" "postgres_url" "secret" .Values.postgresql.existingSecret "secretKey" .Values.postgresql.existingSecretKey) | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.migrations.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
