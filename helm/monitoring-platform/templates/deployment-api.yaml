{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-platform.fullname" . }}-api
  labels:
    {{- include "monitoring-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "monitoring-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "monitoring-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "monitoring-platform.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.postgresql.enabled .Values.nats.enabled }}
      initContainers:
        {{- if .Values.postgresql.enabled }}
        - name: wait-for-postgresql
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z {{ include "monitoring-platform.postgresHost" . }} 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
        {{- end }}
        {{- if .Values.nats.enabled }}
        - name: wait-for-nats
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z {{ include "monitoring-platform.natsHost" . }} 4222; do
                echo "Waiting for NATS..."
                sleep 2
              done
        {{- end }}
      {{- end }}
      containers:
      - name: api
        image: "{{ .Values.image.repository }}-api:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["./api"]
        ports:
        - name: http
          containerPort: {{ .Values.api.httpPort }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.api.metricsPort }}
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "api"
        - name: HTTP_PORT
          value: "{{ .Values.api.httpPort }}"
        - name: METRICS_PORT
          value: "{{ .Values.api.metricsPort }}"
        - name: LOG_LEVEL
          value: "{{ .Values.api.logLevel }}"
        - name: POSTGRES_URL
          value: {{ include "monitoring-platform.postgresUrl" . | quote }}
        - name: NATS_URL
          value: {{ include "monitoring-platform.natsUrl" . | quote }}
        - name: ADMIN_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "monitoring-platform.fullname" . }}-secret
              key: admin_jwt_secret
        {{- with .Values.api.publicBaseURL }}
        - name: PUBLIC_BASE_URL
          value: {{ . | quote }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
