sonar.organization=yassinebenameur
sonar.projectKey=yassinebenameur_probara
sonar.projectName=Probara

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/test_*.py,ai-service/tests/**
# A file is either source or test: the test patterns are repeated here.
# ai-service/artifacts holds model manifests and LFS pointers, not code.
sonar.exclusions=**/*_test.go,**/*.test.ts,**/test_*.py,ai-service/tests/**,ai-service/artifacts/**

# CI produces Go coverage only (the merged profile from build-test.yml), so
# other languages stay out of the coverage metric instead of counting as 0%.
sonar.go.coverage.reportPaths=coverage-main.out
sonar.coverage.exclusions=web/**,website/**,ai-service/**,**/*.py

sonar.python.version=3.13
